<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Photobooth</title>

<style>
body {
    font-family: Arial;
    text-align: center;
    background: #111;
    color: white;
}

/* HALAMAN */
.page {
    display: none;
}
.active {
    display: block;
}

/* PILIH FRAME */
.frame-option {
    display: inline-block;
    width: 120px;
    height: 240px;
    border: 3px solid white;
    margin: 10px;
    cursor: pointer;
    background-size: cover;
    background-position: center;
}

/* KAMERA */
#cameraPage {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 20px;
}

/* VIDEO */
video {
    width: 300px;
    border: 3px solid white;
}

/* FRAME */
.frame {
    width: 200px;
    height: 400px;
    position: relative;
    background: black;
}

/* SLOT FOTO */
.photo-slot {
    width: 100%;
    height: 33.3%;
    position: relative;
    overflow: hidden;
}

.photo-slot img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* TOMBOL HAPUS */
.delete-btn {
    position: absolute;
    top: 5px;
    right: 5px;
    background: red;
    color: white;
    border: none;
    cursor: pointer;
    font-size: 12px;
}

/* FRAME PNG */
#frameOverlay {
    position: absolute;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    pointer-events: none;
}

/* BUTTON STYLE */
button {
    padding: 10px;
    margin: 5px;
    cursor: pointer;
}
</style>

</head>

<body>

<!-- HALAMAN PILIH FRAME -->
<div id="homePage" class="page active">
    <h1>Pilih Frame</h1>

    <div class="frame-option" style="background-image:url('frame1.png')" onclick="selectFrame('frame1.png')"></div>
    <div class="frame-option" style="background-image:url('frame2.png')" onclick="selectFrame('frame2.png')"></div>
    <div class="frame-option" style="background-image:url('frame3.png')" onclick="selectFrame('frame3.png')"></div>
    <div class="frame-option" style="background-image:url('frame4.png')" onclick="selectFrame('frame4.png')"></div>
</div>

<!-- HALAMAN KAMERA -->
<div id="cameraPage" class="page">

    <div>
        <video id="video" autoplay></video><br>

        <button onclick="takePhoto()">Ambil Foto</button>
        <button onclick="resetPhotos()">Reset</button>
        <button onclick="goBack()">Back</button>
        <button onclick="downloadPhoto()">Download</button>
    </div>

    <div class="frame" id="frame">
        <div class="photo-slot"></div>
        <div class="photo-slot"></div>
        <div class="photo-slot"></div>

        <img id="frameOverlay" src="">
    </div>

</div>

<canvas id="canvas" style="display:none;"></canvas>

<script>

let currentSlot = 0;
let stream;

/* PILIH FRAME */
function selectFrame(frameSrc) {
    document.getElementById("homePage").classList.remove("active");
    document.getElementById("cameraPage").classList.add("active");

    document.getElementById("frameOverlay").src = frameSrc;

    startCamera();
}

/* START CAMERA */
async function startCamera() {
    stream = await navigator.mediaDevices.getUserMedia({ video: true });
    document.getElementById("video").srcObject = stream;
}

/* AMBIL FOTO */
function takePhoto() {
    if (currentSlot >= 3) return;

    let video = document.getElementById("video");
    let canvas = document.getElementById("canvas");

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    let ctx = canvas.getContext("2d");
    ctx.drawImage(video, 0, 0);

    let imgData = canvas.toDataURL("image/png");

    let slot = document.getElementsByClassName("photo-slot")[currentSlot];

    let img = document.createElement("img");
    img.src = imgData;

    let delBtn = document.createElement("button");
    delBtn.innerText = "X";
    delBtn.className = "delete-btn";

    delBtn.onclick = () => {
        slot.innerHTML = "";
        currentSlot--;
    };

    slot.appendChild(img);
    slot.appendChild(delBtn);

    currentSlot++;
}

/* RESET FOTO */
function resetPhotos() {
    let slots = document.getElementsByClassName("photo-slot");

    for (let i = 0; i < slots.length; i++) {
        slots[i].innerHTML = "";
    }

    currentSlot = 0;
}

/* BACK KE HALAMAN AWAL */
function goBack() {
    document.getElementById("cameraPage").classList.remove("active");
    document.getElementById("homePage").classList.add("active");

    resetPhotos();

    if (stream) {
        stream.getTracks().forEach(track => track.stop());
    }
}

/* DOWNLOAD */
function downloadPhoto() {
    let frame = document.getElementById("frame");

    html2canvas(frame).then(canvas => {
        let link = document.createElement("a");
        link.download = "photobooth.png";
        link.href = canvas.toDataURL();
        link.click();
    });
}

</script>

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

</body>
</html>
