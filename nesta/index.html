<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Photo Booth</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #111;
      color: white;
      text-align: center;
    }

    h2 {
      margin-top: 20px;
    }

    video, canvas {
      width: 90%;
      max-width: 350px;
      border-radius: 12px;
    }

    button {
      margin-top: 15px;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      background: #ff4d6d;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #download {
      display: none;
      background: #00c853;
    }
  </style>
</head>
<body>

<h2>📸 Photo Booth</h2>

<video id="video" autoplay playsinline></video>
<br>
<button onclick="startCountdown()">Ambil Foto</button>

<br><br>

<canvas id="canvas"></canvas>

<br>
<button id="download" onclick="downloadPhoto()">Download</button>

<script>
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const downloadBtn = document.getElementById('download');

  // Akses kamera
  navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
    .then(stream => video.srcObject = stream)
    .catch(() => alert("Kamera tidak bisa diakses"));

  // Timer
  function startCountdown() {
    let count = 3;
    const interval = setInterval(() => {
      document.querySelector("h2").innerText = "Foto dalam " + count;
      count--;

      if (count < 0) {
        clearInterval(interval);
        document.querySelector("h2").innerText = "📸 Photo Booth";
        takePhoto();
      }
    }, 1000);
  }

  function takePhoto() {
    // Set ukuran canvas sesuai kamera
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    // Gambar foto
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    // Load frame
    const frame = new Image();
    frame.src = "frame.png"; // ⬅️ GANTI dengan file kamu

    frame.onload = () => {
      // Gambar frame full sesuai canvas
      ctx.drawImage(frame, 0, 0, canvas.width, canvas.height);

      // Aktifkan tombol download
      downloadBtn.style.display = "inline-block";

      // Simpan blob
      canvas.toBlob(function(blob) {
        window.photoBlob = blob;
      }, 'image/png');
    };
  }

  function downloadPhoto() {
    const link = document.createElement('a');
    link.download = 'photobooth.png';
    link.href = URL.createObjectURL(window.photoBlob);
    link.click();
  }
</script>

</body>
</html>
