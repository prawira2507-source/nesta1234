<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Photobooth</title>

<style>
body {
    font-family: Arial;
    text-align: center;
    background: #111;
    color: white;
}

/* HALAMAN */
.page {
    display: none;
}

.active {
    display: block;
}

/* FRAME PILIHAN */
.frame-option {
    display: inline-block;
    width: 150px;
    height: 250px;
    border: 3px solid white;
    margin: 10px;
    cursor: pointer;
}

/* KAMERA */
#cameraPage {
    display: flex;
    justify-content: center;
    gap: 20px;
}

/* VIDEO */
video {
    width: 300px;
    border: 3px solid white;
}

/* FRAME PREVIEW */
.frame {
    width: 200px;
    height: 400px;
    border: 5px solid white;
    position: relative;
}

.photo-slot {
    width: 100%;
    height: 33.3%;
    border-bottom: 1px solid gray;
    position: relative;
}

.photo-slot img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.delete-btn {
    position: absolute;
    top: 5px;
    right: 5px;
    background: red;
    color: white;
    border: none;
    cursor: pointer;
}

button {
    padding: 10px;
    margin: 10px;
}
</style>

</head>

<body>

<!-- HALAMAN PILIH FRAME -->
<div id="homePage" class="page active">
    <h1>Pilih Frame</h1>

    <div class="frame-option" onclick="selectFrame()"></div>
    <div class="frame-option" onclick="selectFrame()"></div>
    <div class="frame-option" onclick="selectFrame()"></div>
    <div class="frame-option" onclick="selectFrame()"></div>
</div>

<!-- HALAMAN KAMERA -->
<div id="cameraPage" class="page">

    <div>
        <video id="video" autoplay></video><br>
        <button onclick="takePhoto()">Ambil Foto</button>
        <button onclick="download()">Download</button>
    </div>

    <div class="frame" id="frame">
        <div class="photo-slot"></div>
        <div class="photo-slot"></div>
        <div class="photo-slot"></div>
    </div>

</div>

<canvas id="canvas" style="display:none;"></canvas>

<script>

let currentSlot = 0;
let stream;

/* PILIH FRAME */
function selectFrame() {
    document.getElementById("homePage").classList.remove("active");
    document.getElementById("cameraPage").classList.add("active");

    startCamera();
}

/* AKTIFKAN KAMERA */
async function startCamera() {
    stream = await navigator.mediaDevices.getUserMedia({ video: true });
    document.getElementById("video").srcObject = stream;
}

/* AMBIL FOTO */
function takePhoto() {
    if (currentSlot >= 3) return;

    let video = document.getElementById("video");
    let canvas = document.getElementById("canvas");

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    let ctx = canvas.getContext("2d");
    ctx.drawImage(video, 0, 0);

    let imgData = canvas.toDataURL("image/png");

    let slot = document.getElementsByClassName("photo-slot")[currentSlot];

    let img = document.createElement("img");
    img.src = imgData;

    let delBtn = document.createElement("button");
    delBtn.innerText = "X";
    delBtn.className = "delete-btn";

    delBtn.onclick = () => {
        slot.innerHTML = "";
        currentSlot--;
    };

    slot.appendChild(img);
    slot.appendChild(delBtn);

    currentSlot++;
}

/* DOWNLOAD */
function download() {
    let frame = document.getElementById("frame");

    html2canvas(frame).then(canvas => {
        let link = document.createElement("a");
        link.download = "photo.png";
        link.href = canvas.toDataURL();
        link.click();
    });
}

</script>

<!-- LIBRARY UNTUK DOWNLOAD -->
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

</body>
</html>
